<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZT AQUA TECHNO</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010817;color:white;font-family:Arial,sans-serif}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}main{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8vh 5vw 7vh}header{text-align:center;text-shadow:0 2px 8px #001e3b}h1{margin:0;color:#f2c96c;font-weight:900;letter-spacing:.08em;font-size:clamp(26px,7vw,42px)}header small{font-size:12px;letter-spacing:.15em;color:#e8f8ff}.buttons{width:100%;max-width:510px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 17px}.glass{isolation:isolate;position:relative;min-width:0;height:104px;padding:5px;border-radius:28px;border:2px solid #8deeff;cursor:pointer;color:white;background:linear-gradient(160deg,#e8ffffd9 0%,#42c9fa 9%,#0768b2 27%,#00315f 58%,#0478bd 83%,#76eaff 96%,#e7ffff 100%);box-shadow:0 7px 0 #00254b,0 12px 15px #000b1bd9,0 0 15px #1db9ff7a,inset 0 3px 3px #fff,inset 0 -4px 8px #001b40;transform:translateY(0);transition:transform .16s,box-shadow .16s}.glass:before{content:"";position:absolute;inset:5px 7px 48%;border-radius:23px 23px 40% 40%;background:linear-gradient(#ffffff88,#a5eaff10);pointer-events:none}.inner{position:relative;display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 2px 4px #001b38;font-size:clamp(12px,3.7vw,17px);font-weight:700}.inner svg{width:36px;height:36px;filter:drop-shadow(0 1px 3px #001b35)}.glass.pressed,.glass:active{transform:translateY(8px) scale(.97);box-shadow:0 1px 0 #00254b,0 3px 5px #000b1b,inset 0 5px 12px #00172c,inset 0 -2px 4px #4ac9ff}footer{font-size:11px;letter-spacing:.15em;text-shadow:0 2px 6px #001}.ripple{position:fixed;z-index:2;pointer-events:none;border:2px solid #a4f2ffad;border-radius:50%;width:35px;height:35px;transform:translate(-50%,-50%) scale(.5);box-shadow:0 0 9px #5edfff,0 0 20px #008bdc77,inset 0 0 8px #5edfff;animation:wave 1.1s ease-out forwards}@keyframes wave{0%{opacity:.95;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(8)}}@media(prefers-reduced-motion:reduce){.ripple{animation-duration:.2s}}#notice{position:fixed;z-index:5;bottom:15%;left:12%;right:12%;padding:12px;background:#001e3fe8;border:1px solid #83d9ff;border-radius:12px;text-align:center;display:none}</style></head><body><video autoplay muted loop playsinline preload="auto"><source src="/ZT_AQUA_AGUA_SUPERIOR_PANTALLA_COMPLETA.mp4" type="video/mp4"></video><main><header><h1>ZT AQUA TECHNO</h1><small>PLATAFORMA · DEMOSTRACIÓN</small></header><section class="buttons"><button class="glass" type="button"><span class="inner"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5M9 12h8M9 16h8"/></svg><span>Documentos</span></span></button><button class="glass" type="button"><span class="inner"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l9-9 3 3-9 9-4 1zM13 8l3 3"/></svg><span>Firma y Sello</span></span></button><button class="glass" type="button"><span class="inner"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="11" r="3"/><path d="M7 18c1-4 9-4 10 0"/></svg><span>Identidad (IDV)</span></span></button><button class="glass" type="button"><span class="inner"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6zM8 12l3 3 5-6"/></svg><span>Verificación</span></span></button><button class="glass" type="button"><span class="inner"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7"/></svg><span>Registros</span></span></button><button class="glass" type="button"><span class="inner"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Configuración</span></span></button></section><footer>ZT SOLUCIONES IT</footer></main><div id="notice"></div><script>document.querySelectorAll('.glass').forEach(b=>{let clear;const start=()=>{b.classList.add('pressed');const r=b.getBoundingClientRect();for(let i=0;i<3;i++){const w=document.createElement('div');w.className='ripple';w.style.left=r.left+r.width/2+'px';w.style.top=r.top+r.height/2+'px';w.style.animationDelay=i*130+'ms';document.body.appendChild(w);setTimeout(()=>w.remove(),1500)}clearTimeout(clear);clear=setTimeout(()=>b.classList.remove('pressed'),340)};b.addEventListener('pointerdown',start);b.addEventListener('click',()=>{const n=document.querySelector('#notice');n.textContent=b.innerText+' — demostración visual';n.style.display='block';setTimeout(()=>n.style.display='none',1200)})})</script></body></html>
